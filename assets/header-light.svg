<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f3f0e6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#000000" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame">
      <rect width="900" height="200" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="200" fill="url(#bg)"/>
    <rect width="900" height="200" fill="url(#grid)"/>
    <circle cx="790" cy="40" r="120" fill="#ffc400" fill-opacity="0.14"/>
    <circle cx="860" cy="170" r="80" fill="#ffc400" fill-opacity="0.10"/>
  </g>
  <rect x="48" y="52" width="6" height="96" rx="3" fill="#ffc400"/>
  <text x="76" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#202124">Andrew Harris</text>
  <text x="78" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#5f6368">Game Mods and Tools</text>
  <text x="852" y="186" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#9aa0a6">@iExpulsion</text>
